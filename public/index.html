<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini Flash AI</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-bg"></div>
    <div class="container">
      <header class="hero">
        <div class="hero-copy">
          <span class="eyebrow">Gemini Flash</span>
          <h1>AI Chat for Quick Ideas</h1>
          <p class="subtitle">
            Ask questions, build prompts, or explore ideas with Gemini's fast
            and friendly chat.
          </p>
        </div>
        <div class="hero-badge">Fast • Friendly • Focused</div>
      </header>

      <main class="chat-panel">
        <div id="chat-box" class="chat-box"></div>
        <form id="chat-form" class="chat-form">
          <input
            type="text"
            id="user-input"
            placeholder="Ask anything here..."
            autocomplete="off"
            required
          />
          <button type="submit">Send</button>
        </form>
      </main>

      <footer class="footer-note">
        Tip: keep your messages short for the best response speed.
      </footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
