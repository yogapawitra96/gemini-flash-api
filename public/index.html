<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel AI Assistant</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-bg"></div>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Gemini Flash</p>
          <h1>Travel AI Assistant</h1>
        </div>
        <div class="topbar-actions">
          <button type="button" id="reset-chat" class="ghost-btn">
            Reset Chat
          </button>
          <div class="status-pill">Online</div>
        </div>
      </header>

      <section class="hero-card">
        <div class="hero-copy">
          <p class="subtitle">
            Ceritakan kebutuhan perjalananmu, dan dapatkan jawaban yang cepat,
            jelas, dan friendly.
          </p>
          <div class="chip-row">
            <span>✈️ Tiket</span>
            <span>🏨 Hotel</span>
            <span>🗺️ Itinerary</span>
          </div>
        </div>
      </section>

      <main class="chat-panel">
        <div id="chat-box" class="chat-box"></div>
        <form id="chat-form" class="chat-form">
          <input
            type="text"
            id="user-input"
            placeholder="Tanya soal perjalanan atau bantuan lainnya..."
            autocomplete="off"
            required
          />
          <button type="submit">Kirim</button>
        </form>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
